<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Not here · Keystock</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230A0C11'/><rect x='9' y='11' width='14' height='9' rx='1' fill='%23F7F4EC'/></svg>">
<style>
  /* Without this file, Cloudflare Pages answers every unknown path with the
     homepage and a 200. A mistyped link then looks like it worked, and anyone
     checking whether a page exists is told yes. */
  :root{color-scheme:dark}
  @font-face { font-family:"Libre Franklin"; src:url("assets/libre-franklin-latin.woff2") format("woff2");
               font-weight:400 600; font-style:normal; font-display:swap; }
  body{margin:0;min-height:100svh;display:grid;place-items:center;padding:2rem;
       background:#08090b;color:#f4f2ef;text-align:center;
       font-family:"Libre Franklin","Segoe UI",system-ui,sans-serif;font-size:1.0625rem;line-height:1.55}
  div{max-width:30rem}
  h1{font-size:clamp(1.4rem,5vw,1.9rem);font-weight:600;margin:0 0 .6rem}
  p{color:#9a9ba1;margin:0 0 1.6rem}
  a{display:inline-block;background:#d8ff3e;color:#08090b;text-decoration:none;
    font-weight:600;padding:.8rem 1.5rem;border-radius:2px}
  a:focus-visible{outline:2px solid #f4f2ef;outline-offset:3px}
</style>
</head>
<body>
  <div>
    <h1>There is nothing at this address.</h1>
    <p>The link may be out of date, or mistyped. If it came from a text message
       we sent you, reply to it and we will send a fresh one.</p>
    <a href="/">Back to the start</a>
  </div>
</body>
</html>
